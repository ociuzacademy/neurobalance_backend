{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroBalance Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(120deg,#ede9fe,#ddd6fe,#f5f3ff);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* LOGIN CARD */

.login-card{
    width:420px;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 25px 60px rgba(79,70,229,0.15);
}

/* LOGO */

.logo{
    text-align:center;
    font-weight:700;
    font-size:26px;
    color:#4f46e5;
}

.subtitle{
    text-align:center;
    font-size:14px;
    color:#6b7280;
    margin-bottom:25px;
}

/* INPUTS */

.form-control{
    border-radius:10px;
    padding:12px;
    border:1px solid #e5e7eb;
}

.form-control:focus{
    box-shadow:none;
    border-color:#6366f1;
}

/* BUTTON */

.btn-login{
    background:#6366f1;
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:600;
}

.btn-login:hover{
    background:#4f46e5;
}

/* ILLUSTRATION */

.illustration{
    text-align:center;
    margin-bottom:20px;
}

.illustration img{
    width:90px;
}

/* FOOTER */

.footer-text{
    font-size:13px;
    text-align:center;
    color:#9ca3af;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="login-card">

<div class="illustration">
<img src="{% static 'images/login.jpeg' %}">
</div>

<div class="logo">
NeuroBalance
</div>

<div class="subtitle">
Admin Control Panel
</div>

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label small">Remember</label>
</div>

<a href="#" class="small text-decoration-none">Forgot?</a>

</div>

<button class="btn btn-login w-100">
Sign In
</button>

</form>

<div class="footer-text">
NeuroBalance Admin Access Only
</div>

</div>

</body>
</html>
